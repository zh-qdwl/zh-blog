          - heading "我做了个微信小程序：昊玉工具箱" [level=1] [ref=f48e45]
          - generic [ref=f48e46]:
            - time [ref=f48e47]: 2026年8月13日
            - link "小程序" [ref=f48e48] [cursor=pointer]:
              - /url: /tags/%E5%B0%8F%E7%A8%8B%E5%BA%8F/
            - link "微信云开发" [ref=f48e49] [cursor=pointer]:
              - /url: /tags/%E5%BE%AE%E4%BF%A1%E4%BA%91%E5%BC%80%E5%8F%91/
            - link "Canvas" [ref=f48e50] [cursor=pointer]:
              - /url: /tags/Canvas/
        - generic [ref=f48e51]:
          - paragraph [ref=f48e52]: 起因很朴素：压个图、拼张长图、把发票上的字抠出来——这些事一年要做上几十次，但为每一件装一个小程序太重了，用完就想删。
          - paragraph [ref=f48e53]:
            - text: 于是我把这些高频动作收进了一个小程序：
            - strong [ref=f48e54]: 昊玉工具箱
            - text: 。目标只有一句话——
            - strong [ref=f48e55]: 打开即用，用完带走成果
            - text: 。
          - heading "首发的六个工具" [level=2] [ref=f48e56]
          - table [ref=f48e57]:
            - rowgroup [ref=f48e58]:
              - row [ref=f48e59]:
                - columnheader "工具" [ref=f48e60]
                - columnheader "做什么" [ref=f48e61]
                - columnheader "怎么实现" [ref=f48e62]
            - rowgroup [ref=f48e63]:
              - row [ref=f48e64]:
                - cell "OCR 图片转文字" [ref=f48e65]
                - cell "拍照/选图 → 识别印刷体 → 文字可复制" [ref=f48e66]
                - cell "云函数代理百度 OCR" [ref=f48e67]
              - row [ref=f48e68]:
                - cell "图片压缩 / 格式转换" [ref=f48e69]
                - cell "调质量或尺寸 → 导出，JPG ⇄ PNG" [ref=f48e70]
                - cell "纯前端 Canvas" [ref=f48e71]
              - row [ref=f48e72]:
                - cell "拼图 / 长图拼接" [ref=f48e73]
                - cell "多图竖拼 / 横拼 / 网格" [ref=f48e74]
                - cell "纯前端 Canvas" [ref=f48e75]
              - row [ref=f48e76]:
                - cell "二维码生成" [ref=f48e77]
                - cell "文本转码，也能反向扫码解码" [ref=f48e78]
                - cell "本地 QR 库" [ref=f48e79]
              - row [ref=f48e80]:
                - cell "简历制作" [ref=f48e81]
                - cell "简约 / 双语 / 黑白 三套 Word 模板" [ref=f48e82]
                - cell "云存储直接下载" [ref=f48e83]
              - row [ref=f48e84]:
                - cell "图片加水印" [ref=f48e85]
                - cell "文字或图片水印，可拖拽定位，实时预览" [ref=f48e86]
                - cell "纯前端 Canvas" [ref=f48e87]
          - paragraph [ref=f48e88]:
            - text: 每个工具的结果都统一支持「保存到相册 / 复制」。这一条看着不起眼，但它决定了整个产品的手感：工具类小程序最怕的是
            - strong [ref=f48e89]: 做完了东西却带不走
            - text: 。
          - paragraph [ref=f48e90]:
            - text: 首页会按你本地的使用次数动态排出「常用工具」前五——这个统计
            - strong [ref=f48e91]: 只存在你自己手机上，不上传
            - text: 。
          - heading "三条自我约束" [level=2] [ref=f48e92]
          - paragraph [ref=f48e93]: 做的过程中给自己立了三条规矩，回头看，它们比功能清单更重要。
          - heading "一、只允许一个工具走 API" [level=3] [ref=f48e94]
          - paragraph [ref=f48e95]: 六个工具里，只有 OCR 需要调外部服务，其余全部在端上用 Canvas 算完。
          - paragraph [ref=f48e96]: 这不是偷懒，是刻意的：每多一个 API 就多一份成本、多一个故障点、多一处密钥要保管。招牌工具有一个就够了，其余的能在本地算就在本地算——用户不用等网络，我不用付账单。
          - paragraph [ref=f48e97]:
            - text: OCR 的密钥走微信云开发的云函数，
            - strong [ref=f48e98]: 只存在云函数的环境变量里，前端代码里一个字符都没有
            - text: 。仓库里只有一份
            - code [ref=f48e99]: .env.example
            - text: 占位。
          - heading "二、不编造数字" [level=3] [ref=f48e100]
          - paragraph [ref=f48e101]:
            - text: 首页有个「当前在线人数」的胶囊。它是真的——
            - code [ref=f48e102]: presence
            - text: 云函数按设备心跳去重，统计近 5 分钟活跃数。
          - paragraph [ref=f48e103]:
            - text: 关键在于：
            - strong [ref=f48e104]: 云函数没部署或者断网时，这个胶囊直接不显示
            - text: ，而不是退回到一个随机数或者写死的 “1024 人在线”。
          - paragraph [ref=f48e105]: 这种地方一旦开始编，产品里所有的数字就都不可信了。宁可少一个胶囊。
          - heading "三、广告默认全关" [level=3] [ref=f48e106]
          - paragraph [ref=f48e107]:
            - text: 结果页的 Banner 和 OCR 的激励视频都做好了，但开关在云数据库里，
            - strong [ref=f48e108]: 达标前默认全部关闭
            - text: 。
          - paragraph [ref=f48e109]: 流量主要累计 UV 到一千才能开通，在那之前挂广告位只会拖慢加载、恶心用户，一分钱也赚不到。功能先写好，等真到那天改一个字段就行。
          - heading "「个人主体」是一道硬边界" [level=2] [ref=f48e110]
          - paragraph [ref=f48e111]:
            - text: 这是我做之前没预料到的：
            - strong [ref=f48e112]: 注册主体的类型直接决定了产品能长成什么样。
          - paragraph [ref=f48e113]: 个人主体不能开通虚拟支付，所以 v1 做不了付费会员和内购，变现只能靠广告；不能做 AI 问答类的”深度合成”小程序；不碰金融理财；再加上微信官方规范禁止测算类（算命、星座、占卜）、禁止做小程序导航和互推排行榜、禁止诱导分享。
          - paragraph [ref=f48e114]:
            - text: 这些约束一条条划掉之后，剩下的空间反而清楚了：
            - strong [ref=f48e115]: 做纯粹的工具，靠好用留住人
            - text: 。
          - paragraph [ref=f48e116]: 至于方向，我采取的是”先通用起步”：六个工具刻意跨了不同人群，等后台埋点跑一段时间，看哪类人真的沉淀下来，再往那个方向收窄加深。埋点只有三个事件——进入工具、开始使用、导出成果，够回答”谁在用、用到哪一步”就行。
          - heading "怎么保证它不出错" [level=2] [ref=f48e117]
          - paragraph [ref=f48e118]:
            - text: 小程序没有 DOM，测试是个麻烦事。我的做法是
            - strong [ref=f48e119]: 把纯逻辑从界面里抽出来
            - text: ：尺寸计算、拼图布局、输入校验、OCR 结果解析、水印几何、内容安全解析、埋点、广告配置——这些全是不依赖
            - code [ref=f48e120]: wx
            - text: API 的纯函数，放进
            - code [ref=f48e121]: utils/
            - text: ，用 Jest 直接在 Node 里测，目前 13 个 suite、44 个用例。
          - paragraph [ref=f48e122]:
            - text: 剩下的 Canvas 绘制和界面主流程测不了，就老老实实在开发者工具和真机上跑。
            - strong [ref=f48e123]: 分不清哪些能自动测、哪些只能手动验，是这类项目最容易翻车的地方。
          - paragraph [ref=f48e124]:
            - text: UI 这边单独写了一份
            - code [ref=f48e125]: DESIGN.md
            - text: 作为唯一事实来源：颜色、间距、字号、动效时长全部令牌化，改界面前先读它。这份文档是被坑出来的——早期出过”白色图标压在浅玫红底盘上几乎看不见”的 bug，之后就在文档里写死了规则：
            - strong [ref=f48e126]: 图标底盘用浅色，图标本身用对应主色，绝不把浅色前景压在浅色底上
            - text: 。
          - paragraph [ref=f48e127]: 顺带一提，全站动效都尊重系统的「减少动态效果」设置。
          - heading "去哪儿找它" [level=2] [ref=f48e128]
          - img "昊玉工具箱 小程序码" [ref=f48e129]
          - list [ref=f48e130]:
            - listitem [ref=f48e131]:
              - strong [ref=f48e132]: 电脑上
              - text: ：用手机微信扫上面的码
            - listitem [ref=f48e133]:
              - strong [ref=f48e134]: 手机上
              - text: ：长按图片识别（在微信里打开这个页面最稳）
            - listitem [ref=f48e135]:
              - text: 或者直接在微信里搜小程序「
              - strong [ref=f48e136]: 昊玉工具箱
              - text: 」
          - paragraph [ref=f48e137]:
            - text: 不用下载，用完关掉即可。有想加的工具，或者哪个地方用着别扭，欢迎在
            - link "留言板" [ref=f48e138] [cursor=pointer]:
              - /url: /guestbook
            - text: 告诉我。
